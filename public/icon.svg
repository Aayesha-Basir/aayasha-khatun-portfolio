<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <title>Aayasha Khatun — AK</title>
  <style>
    .bg { fill: var(--bg); }
    .fg { fill: var(--fg); }
    @media (prefers-color-scheme: light) {
      :root { --bg: #0a0a0a; --fg: #ffffff; }
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #ffffff; --fg: #0a0a0a; }
    }
  </style>
  <rect class="bg" width="180" height="180" rx="36" />
  <g transform="translate(0,0)">
    <circle class="fg" cx="90" cy="90" r="44" />
    <text x="90" y="108" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="700" font-size="72" class="bg">AK</text>
  </g>
</svg>